name: "CodeQL Advanced Setup"

on:
  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev

  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

  # Scheduled run: every Saturday at 8pm UTC
  schedule:
    - cron: '0 20 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      # actions: read
      # contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        queries: security-extended,security-and-quality

    # Cache compiler outputs for C/C++.
    - name: Install ccache
      if: matrix.build-mode == 'manual'
      run: sudo apt-get install -y ccache

    - name: Cache compiler objects
      if: matrix.build-mode == 'manual'
      uses: actions/cache@v5.1.0
      with:
        path: ${{ github.workspace }}/.cache/ccache
        # The exact key changes on every commit, saving a new cache at the end
        key: ${{ runner.os }}-ccache-codeql-${{ github.sha }}
        # Restores the most recent cache starting with this prefix
        restore-keys: |
          ${{ runner.os }}-ccache-codeql-

    # Manual build steps
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      # Force CCache to consistently use the same cache directory
      env:
        CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      run: |
        chmod +x gamesman_install.sh 
        ./gamesman_install.sh --install
        ccache -s

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
