name: CI Build and Test

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:
  
  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev
      
  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Job 1: Build and Run Tests (ASan, TSan, Coverage)
  test:
    name: Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let all presets finish even if one fails
      matrix:
        preset: [ci-asan, ci-tsan, ci-coverage]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Install ccache system binaries
      - name: Install ccache
        run: sudo apt-get install -y ccache

      # Set up the GitHub Cache (Isolated per matrix preset)
      - name: Cache compiler objects
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ccache
          # Include ${{ matrix.preset }} in the keys to keep the builds separated
          key: ${{ runner.os }}-ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.preset }}-

      # Configure Gamesman
      - name: Configure Gamesman
        run: |
          chmod +x gamesman_install.sh 
          ./gamesman_install.sh --install

      # Inject CCACHE environment variables so CMake routes builds correctly
      - name: Configure CMake
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }}-test

