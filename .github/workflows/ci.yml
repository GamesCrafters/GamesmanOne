name: CI Build and Test

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:
  
  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev
      
  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Job 1: Build and Run Tests (ASan, TSan, Coverage)
  test:
    name: Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let all presets finish even if one fails
      matrix:
        preset: [ci-asan, ci-tsan, ci-coverage]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          # Ensure script is executable and install Debian/Ubuntu packages
          chmod +x gamesman_install.sh 
          ./gamesman_install.sh --install

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }}-test

