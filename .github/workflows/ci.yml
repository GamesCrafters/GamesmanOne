name: CI Build and Test

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:
  
  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev
      
  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ==========================================
  # JOB 1: Unit Tests
  # ==========================================
  unit-test:
    name: Unit Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-asan, ci-asan-st, ci-coverage, ci-coverage-st]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh 
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Run Unit Tests
        run: ctest --preset ${{ matrix.preset }}-test


  # ==========================================
  # JOB 2: End-to-End Tests
  # ==========================================
  e2e-test:
    name: E2E Test (${{ matrix.preset }}, ${{ matrix.test_case.game }}-${{ matrix.test_case.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-asan, release]
        # Added the game and variant combinations
        test_case:
          - { game: "fsvp", variant: "10" }
          - { game: "mttt", variant: "0" }
          - { game: "mkaooa", variant: "0" }
          - { game: "mills", variant: "72" }
          - { game: "mtttier", variant: "0" }
          - { game: "quixo", variant: "1" }
          - { game: "quixo", variant: "2" }
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh 
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install E2E Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest syrupy

      - name: Run End-to-End Tests
        env:
          GAMESMAN_PRESET: ${{ matrix.preset }}
        run: pytest tests/e2e/e2e_test.py -k "${{ matrix.test_case.game }}-${{ matrix.test_case.variant }}" -v

