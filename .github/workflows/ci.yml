name: CI Build and Test

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:
  
  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev
      
  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ==========================================
  # JOB 1: Unit Tests
  # ==========================================
  unit-test:
    name: Unit Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-asan, ci-coverage]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache compiler objects
        uses: actions/cache@v5.1.0
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # Include ${{ matrix.preset }} in the keys to keep the builds separated
          key: ${{ runner.os }}-ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.preset }}-

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh 
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: |
          cmake --build --preset ${{ matrix.preset }}-build
          ccache -s

      - name: Run Unit Tests
        run: ctest --preset ${{ matrix.preset }}-test


  # ==========================================
  # JOB 2: End-to-End Tests
  # ==========================================
  e2e-test:
    name: E2E Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-asan, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache compiler objects
        uses: actions/cache@v5.1.0
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ${{ runner.os }}-ccache-e2e-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-e2e-${{ matrix.preset }}-

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh 
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: |
          cmake --build --preset ${{ matrix.preset }}-build
          ccache -s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install E2E Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest syrupy

      - name: Run End-to-End Tests
        env:
          GAMESMAN_PRESET: ${{ matrix.preset }}
        run: pytest tests/e2e/e2e_test.py -v

