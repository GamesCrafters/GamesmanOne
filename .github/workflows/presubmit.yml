name: Presubmit

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:

  # Runs when code is actually pushed/merged into these branches
  push:
    branches:
      - main
      - dev

  # Runs when a PR is opened or updated targeting these branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ==========================================
  # JOB 1: Unit Tests
  # ==========================================
  unit-test:
    name: Unit Test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci-asan, ci-asan-st, ci-coverage, ci-coverage-st]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh
          ./gamesman_setup.sh --install-deps

      - name: Run Unit Testing Workflow
        run: cmake --workflow --preset ${{ matrix.preset }}

  # ==========================================
  # JOB 2: E2E Game Tests
  # ==========================================
  e2e-game-test:
    name: E2E Game Test (${{ matrix.os }}, ${{ matrix.test_case.game }}-${{ matrix.test_case.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # NOTE: Keep in sync with GAME_TESTS_PRESUBMIT in tests/e2e/games.py
        test_case:
          - { game: "dshogi", variant: "0" }
          - { game: "fsvp", variant: "0" }
          - { game: "fsvp", variant: "1" }
          - { game: "fsvp", variant: "2" }
          - { game: "fsvp", variant: "3" }
          - { game: "fsvp", variant: "4" }
          - { game: "fsvp", variant: "5" }
          - { game: "fsvp", variant: "6" }
          - { game: "fsvp", variant: "7" }
          - { game: "fsvp", variant: "8" }
          - { game: "fsvp", variant: "9" }
          - { game: "fsvp", variant: "10" }
          - { game: "fsvp", variant: "11" }
          - { game: "fsvp", variant: "12" }
          - { game: "fsvp", variant: "13" }
          - { game: "fsvp", variant: "14" }
          - { game: "gobbletg", variant: "0" }
          - { game: "mills", variant: "18" }
          - { game: "mills", variant: "90" }
          - { game: "mkaooa", variant: "0" }
          - { game: "mttt", variant: "0" }
          - { game: "mtttier", variant: "0" }
          - { game: "quixo", variant: "1" }
          - { game: "quixo", variant: "2" }
          - { game: "teeko", variant: "0" }
          - { game: "teeko", variant: "1" }
          - { game: "winkers", variant: "0" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        run: cmake --preset ci-asan

      - name: Build
        run: cmake --build --preset ci-asan-build

      - name: Run Game Test
        run: |
          ./build/ci-asan/src/gamesman test \
            ${{ matrix.test_case.game }} \
            ${{ matrix.test_case.variant }} \
            --seed=42

  # ==========================================
  # JOB 3: E2E Core System Tests
  # ==========================================
  e2e-core-system-test:
    name: E2E Core System Test (${{ matrix.os }}, ${{ matrix.preset }}, ${{ matrix.test_case.game }}-${{ matrix.test_case.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci-asan, release]
        # NOTE: Keep in sync with HEADLESS_GAMES in tests/e2e/games.py
        test_case:
          - { game: "fsvp", variant: "10" }
          - { game: "mttt", variant: "0" }
          - { game: "mkaooa", variant: "0" }
          - { game: "mills", variant: "72" }
          - { game: "mtttier", variant: "0" }
          - { game: "quixo", variant: "1" }
          - { game: "quixo", variant: "2" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install E2E Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest syrupy

      - name: Run Tests
        env:
          GAMESMAN_PRESET: ${{ matrix.preset }}
        run: pytest tests/e2e/test_headless.py -k "${{ matrix.test_case.game }}-${{ matrix.test_case.variant }}" -v

  # ==========================================
  # JOB 4: E2E Interactive Tests
  # ==========================================
  e2e-interactive-test:
    name: E2E Interactive Test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # macOS disabled due to terminal race conditions
        preset: [ci-asan] # Must not include release here due to animated terminal output

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Gamesman
        run: |
          chmod +x gamesman_setup.sh
          ./gamesman_setup.sh --install-deps

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install E2E Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest syrupy pexpect

      - name: Run Tests
        env:
          GAMESMAN_PRESET: ${{ matrix.preset }}
        run: pytest tests/e2e/test_interactive.py -v

